stages:
  - build
  - test

build_job:
  stage: build
  script:
    - echo "Building the app..."
    - mkdir -p dist
    - echo "app version 1.0" > dist/app.txt
  artifacts:
    paths:
      - dist/

test_job:
  stage: test
  script:
    - echo "Running tests..."
    - cat dist/app.txt
    - test -f dist/app.txt && echo "TEST PASSED: app.txt exists"
