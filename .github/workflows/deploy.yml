name: CI/CD Pipeline

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run tests
        run: bash test.sh

  marker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Create deploy marker
        run: echo "commit ${{ github.sha }} is ready to deploy"


